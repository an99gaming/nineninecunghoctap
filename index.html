<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Học Tập Cá Nhân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Thanh Header Navigation -->
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon">📚</span>
            <span class="logo-text">Góc Học Tập</span>
        </div>

        <nav class="nav-links">
            <a href="#">Trang chủ</a>
            <a href="#">Khóa học</a>
            <a href="#" class="has-badge">Thi thử <span class="badge badge-hot">HOT</span></a>
            <a href="#">Tài liệu</a>
            <a href="#">Tin tức ▾</a>
            <a href="#">Cộng đồng</a>
            <a href="#" class="has-badge">Lớp của tôi <span class="badge badge-vip">👑</span></a>
        </nav>

        <div class="auth-buttons">
            <button class="btn btn-primary" onclick="openModal('register')">Đăng ký học</button>
            <button class="btn btn-outline" onclick="openModal('login')">➜ Đăng nhập</button>
        </div>
    </header>

    <!-- Nội dung chính -->
    <main class="container">
        <section class="video-container">
            <iframe id="main-player" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe>
            <h2 id="video-title">Bài 1: Giới thiệu khóa học</h2>
            <div class="notes">
                <h3>Ghi chú bài học:</h3>
                <p id="video-desc">Nội dung tóm tắt kiến thức trọng tâm...</p>
            </div>
        </section>

        <aside class="playlist">
            <h3>Danh Sách Bài Học</h3>
            <ul id="lesson-list">
                <li class="active" onclick="changeVideo('dQw4w9WgXcQ', 'Bài 1: Giới thiệu', 'Nội dung ghi chú bài 1...')">Bài 1: Giới thiệu</li>
                <li onclick="changeVideo('dQw4w9WgXcQ', 'Bài 2: Kiến thức cơ bản', 'Nội dung ghi chú bài 2...')">Bài 2: Kiến thức cơ bản</li>
            </ul>
        </aside>
    </main>

    <!-- CỬA SỔ BẬT LÊN (MODAL LOG IN / REGISTER) -->
    <div id="authModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <!-- Tab Chuyển đổi Đăng nhập / Đăng ký -->
            <div class="tab-header">
                <button id="tab-login-btn" class="tab-btn active" onclick="switchTab('login')">Đăng nhập</button>
                <button id="tab-register-btn" class="tab-btn" onclick="switchTab('register')">Đăng ký</button>
            </div>

            <!-- Form Đăng Nhập -->
            <form id="login-form" class="auth-form" onsubmit="handleAuth(event, 'Đăng nhập')">
                <div class="form-group">
                    <label>Tên đăng nhập hoặc Email</label>
                    <input type="text" required placeholder="Nhập email hoặc tên tài khoản">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" required placeholder="Nhập mật khẩu">
                </div>
                <button type="submit" class="submit-btn">Đăng nhập</button>
            </form>

            <!-- Form Đăng Ký -->
            <form id="register-form" class="auth-form hidden" onsubmit="handleAuth(event, 'Đăng ký')">
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" required placeholder="Nhập họ và tên của bạn">
                </div>
                <div class="form-group">
                    <label>Địa chỉ Email</label>
                    <input type="email" required placeholder="VD: user@gmail.com">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" required placeholder="Tạo mật khẩu mạnh">
                </div>
                <button type="submit" class="submit-btn green-btn">Tạo tài khoản</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
