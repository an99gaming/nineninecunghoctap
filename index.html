<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Góc Học Tập Cá Nhân</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>



    <!-- Header Navigation -->

    <header class="navbar">

        <div class="logo">

            <span class="logo-icon">📚</span>

            <span class="logo-text">Góc Học Tập</span>

            <span id="admin-badge" class="badge badge-hot" style="display: none; position: static; margin-left: 8px;">ADMIN</span>

        </div>



        <nav class="nav-links">

            <a href="#">Trang chủ</a>

            <a href="#">Khóa học</a>

            <a href="#" class="has-badge">Thi thử <span class="badge badge-hot">HOT</span></a>

            <a href="#">Tài liệu</a>

            <a href="#">Tin tức ▾</a>

            <a href="#">Cộng đồng</a>

            <a href="#" class="has-badge">Lớp của tôi <span class="badge badge-vip">👑</span></a>

        </nav>



        <div id="user-display" style="font-weight: bold; color: #00a651; margin-right: 10px;"></div>



        <div id="auth-btns" class="auth-buttons">

            <button class="btn btn-primary" onclick="openModal('register')">Đăng ký học</button>

            <button class="btn btn-outline" onclick="openModal('login')">➜ Đăng nhập</button>

        </div>

        <button id="logout-btn" class="btn btn-outline" style="display: none;" onclick="logout()">Đăng xuất</button>

    </header>



    <!-- Main Content -->

    <main class="container">

        <section class="video-container">

            <iframe id="main-player" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe>

            <h2 id="video-title">Bài 1: Giới thiệu khóa học</h2>

            <div class="notes">

                <h3>Ghi chú bài học:</h3>

                <p id="video-desc">Nội dung tóm tắt kiến thức trọng tâm...</p>

            </div>

        </section>



        <aside class="playlist">

            <h3>Danh Sách Bài Học</h3>

            <ul id="lesson-list">

                <li class="active" onclick="changeVideo('dQw4w9WgXcQ', 'Bài 1: Giới thiệu', 'Nội dung ghi chú bài 1...')">Bài 1: Giới thiệu</li>

                <li onclick="changeVideo('dQw4w9WgXcQ', 'Bài 2: Kiến thức cơ bản', 'Nội dung ghi chú bài 2...')">Bài 2: Kiến thức cơ bản</li>

            </ul>

        </aside>

    </main>



    <!-- Modal Popup -->

    <div id="authModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">

        <div class="modal-box">

            <span class="close-btn" onclick="closeModal()">&times;</span>

            

            <div class="tab-header">

                <button id="tab-login-btn" class="tab-btn active" onclick="switchTab('login')">Đăng nhập</button>

                <button id="tab-register-btn" class="tab-btn" onclick="switchTab('register')">Đăng ký</button>

            </div>



            <!-- Form Đăng Nhập -->

            <form id="login-form" class="auth-form" onsubmit="handleAuth(event, 'login')">

                <div class="form-group">

                    <label>Địa chỉ Email</label>

                    <input type="email" id="login-email" required placeholder="Nhập email của bạn">

                </div>

                <div class="form-group">

                    <label>Mật khẩu</label>

                    <input type="password" id="login-pass" required placeholder="Nhập mật khẩu">

                </div>

                <button type="submit" class="submit-btn">Đăng nhập</button>

                

                <div style="margin-top: 15px; text-align: center;">

                    <p style="font-size: 13px; color: #666; margin-bottom: 8px;">Hoặc đăng nhập bằng</p>

                    <button type="button" class="btn btn-outline" style="width: 100%; font-weight: bold;" onclick="loginWithGoogle()">🌐 Đăng nhập bằng Google</button>

                </div>

            </form>



            <!-- Form Đăng Ký -->

            <form id="register-form" class="auth-form hidden" onsubmit="handleAuth(event, 'register')">

                <div class="form-group">

                    <label>Địa chỉ Email</label>

                    <input type="email" id="register-email" required placeholder="VD: user@gmail.com">

                </div>

                <div class="form-group">

                    <label>Mật khẩu (Tối thiểu 6 ký tự)</label>

                    <input type="password" id="register-pass" minlength="6" required placeholder="Tạo mật khẩu">

                </div>

                <button type="submit" class="submit-btn green-btn">Tạo tài khoản</button>

            </form>

        </div>

    </div>



    <!-- Nhúng Firebase SDK & File Script chính -->

    <script type="module" src="script.js"></script>

</body>

</html>
