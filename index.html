<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chín Nơi Cùng Học Tập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Modal Đăng nhập / Đăng ký -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 class="modal-title">Tài khoản học tập</h2>

            <!-- Tab Switcher -->
            <div class="auth-tabs">
                <button id="tab-login-btn" class="tab-btn active" onclick="switchTab('login')">Đăng nhập</button>
                <button id="tab-register-btn" class="tab-btn" onclick="switchTab('register')">Đăng ký</button>
            </div>

            <!-- Form Đăng nhập -->
            <form id="login-form" class="auth-form" onsubmit="handleAuth(event, 'login')">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="nhapemail@gmail.com">
                </div>
                <div class="form-group">
                    <label for="login-pass">Mật khẩu</label>
                    <input type="password" id="login-pass" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn green-btn">Đăng nhập</button>

                <div class="divider"><span>hoặc</span></div>

                <button type="button" class="google-btn" onclick="loginWithGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Đăng nhập bằng Google
                </button>
            </form>

            <!-- Form Đăng ký -->
            <form id="register-form" class="auth-form hidden" onsubmit="handleAuth(event, 'register')">
                <div class="form-group">
                    <label for="register-fullname">Họ và tên</label>
                    <input type="text" id="register-fullname" required placeholder="Nguyễn Văn A">
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required placeholder="email@gmail.com">
                </div>
                <div class="form-group">
                    <label for="register-pass">Mật khẩu</label>
                    <input type="password" id="register-pass" minlength="6" required placeholder="Tạo mật khẩu (tối thiểu 6 ký tự)">
                </div>
                <button type="submit" class="submit-btn green-btn">Tạo tài khoản</button>

                <div class="divider"><span>hoặc</span></div>

                <button type="button" class="google-btn" onclick="loginWithGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Đăng ký bằng Google
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
